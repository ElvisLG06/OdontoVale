<style>
/* Sin zoom por doble toque ni pellizco */
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* Solo vertical: en celular horizontal se pide girar */
#girar{display:none}
@media (orientation:landscape) and (max-height:520px){
  #girar{display:flex;position:fixed;inset:0;z-index:200;background:#F8F3EC;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:"Manrope",system-ui,sans-serif;color:#33291F;text-align:center;padding:20px}
  #girar svg{width:56px;height:56px}
  #girar b{font-family:"Outfit","Manrope",sans-serif;font-size:20px;font-weight:600}
  #girar span{font-size:14px;color:#86776A}
  body{overflow:hidden}
}
/* Pantalla de inicio: va primero para que nunca se vea un fondo negro */
html{background:#F8F3EC}
#splash{position:fixed;inset:0;z-index:100;background:#F8F3EC;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .45s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .tile{width:96px;height:96px;border-radius:26px;background:#8C6A4F;position:relative;overflow:hidden;box-shadow:0 10px 26px rgba(140,106,79,.28);animation:sp-pop .6s cubic-bezier(.2,1.4,.4,1) both}
#splash .tile svg.t{width:96px;height:96px;display:block}
#splash .stroke{stroke-dasharray:150;stroke-dashoffset:150;animation:sp-draw .65s .3s ease forwards}
#splash .fill{opacity:0;animation:sp-fade .3s .9s ease forwards}
#splash .shine{position:absolute;top:-20%;left:-60%;width:40%;height:140%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);transform:skewX(-20deg);animation:sp-shine .6s 1.2s ease-in-out both}
#splash .spark{position:absolute;top:13px;right:13px;width:12px;height:12px;opacity:0;animation:sp-spark .6s 1.6s ease both}
#splash .nm{font-family:"Outfit","Manrope",system-ui,sans-serif;font-weight:600;font-size:28px;letter-spacing:-.01em;color:#33291F;height:36px}
#splash .nm span{display:inline-block;opacity:0;animation:sp-up .4s ease forwards}
#splash .sb{font-family:"Manrope",system-ui,sans-serif;font-size:13px;color:#86776A;font-weight:600;margin-top:-10px;opacity:0;animation:sp-up .5s 2.05s ease forwards}
@keyframes sp-pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes sp-draw{to{stroke-dashoffset:0}}
@keyframes sp-fade{to{opacity:1}}
@keyframes sp-shine{from{left:-60%}to{left:130%}}
@keyframes sp-spark{0%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}100%{opacity:0;transform:scale(.6) rotate(90deg)}}
@keyframes sp-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}
</style>

<style>
/* Layout: app móvil de una columna, barra inferior fija, hojas deslizables desde abajo. */
:root{
  --bg:#FFFFFF;
  --sand:#F8F3EC;      /* beige muy suave: fondos de zona */
  --beige:#EFE5D7;     /* beige: chips, bordes activos */
  --line:#EDE6DC;
  --ink:#33291F;
  --muted:#86776A;
  --accent:#8C6A4F;    /* tostado */
  --accent-soft:#F3EADF;
  --ok:#5E8B6B; --ok-soft:#E8F1EA;
  --warn:#B4674F; --warn-soft:#F7E6E0;
  --red:#D8574B; --blue:#3E74C9; --green:#3A9D5D;
  --display:"Outfit", "Manrope", system-ui, sans-serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:16px;
  color-scheme: light;
}
*{box-sizing:border-box}
html{min-height:100%;margin:0}
html.listo{background:#FFFFFF}
body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}

#app{max-width:520px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(var(--tabh, 90px) + 16px);}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.eyebrow{font-size:13px;color:var(--muted);font-weight:600}
.top h1{font-size:26px;line-height:1.15;margin-top:2px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px;stroke:var(--ink)}

/* buscador */
.search{position:relative;margin-bottom:16px}
.search input{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--sand);padding:0 14px 0 42px;font-size:15px}
.search input:focus{outline:none;border-color:var(--accent);background:var(--bg)}
.search svg{position:absolute;left:14px;top:14px;width:20px;height:20px;stroke:var(--muted)}
.results{position:absolute;z-index:20;left:0;right:0;top:54px;background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(60,40,20,.12);overflow:hidden;max-height:340px;overflow-y:auto}
.results button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:10px 14px;border-bottom:1px solid var(--line)}
.results button:last-child{border-bottom:0}
.results button:active{background:var(--sand)}
.results .empty{padding:14px;color:var(--muted)}

.avatar{width:38px;height:38px;border-radius:50%;background:var(--beige);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.avatar.lg{width:60px;height:60px;font-size:20px}
.sub{font-size:13px;color:var(--muted)}

/* resumen del día */
.now{background:var(--sand);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;display:flex;gap:14px;align-items:center}
.now .big{font-family:var(--display);font-size:30px;font-weight:600;line-height:1;color:var(--accent)}
.now .lbl{font-size:12px;color:var(--muted);font-weight:600}
.now .who{font-weight:700}
.now .sep{width:1px;align-self:stretch;background:var(--line)}

.dayhead{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.dayhead h2{font-size:18px}
.daynav{display:flex;gap:6px}
.daynav button{height:34px;min-width:34px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:600}

/* lista de citas */
.timeline{display:flex;flex-direction:column;gap:10px}
.cita{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg);text-align:left;width:100%;position:relative}
.cita:active{background:var(--sand)}
.cita .hora{font-family:var(--display);font-weight:600;font-size:17px}
.cita .hora small{display:block;font-family:var(--body);font-size:11px;color:var(--muted);font-weight:500}
.cita .nombre{font-weight:700;line-height:1.25}
.cita.ahora{border-color:var(--accent);background:var(--accent-soft)}
.cita.ahora::before{content:"";position:absolute;left:-1px;top:12px;bottom:12px;width:4px;border-radius:4px;background:var(--accent)}
.cita.done{opacity:.72}
.pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap;background:var(--beige);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.now{background:var(--accent);color:#fff}
.pill.muted{background:var(--sand);color:var(--muted)}

.emptybox{border:1.5px dashed var(--beige);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--muted)}
.emptybox b{display:block;color:var(--ink);font-family:var(--display);font-size:17px;margin-bottom:4px}

/* botones */
.btn{height:46px;padding:0 18px;border-radius:13px;border:1px solid var(--line);background:var(--bg);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
a.btn{text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.soft{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
.btn.danger{color:var(--warn);border-color:var(--warn-soft)}
.btn.sm{height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:0}

/* barra inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#FFFFFF;border-top:1px solid var(--line);padding:6px 10px max(4px, calc(env(safe-area-inset-bottom) - 26px))}
.tabbar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center}
.tabbar a,.tabbar button.t{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);text-decoration:none;background:none;border:0;padding:4px 0}
.tabbar svg{width:23px;height:23px;stroke:currentColor}
.tabbar a.on{color:var(--accent)}
.fab{width:54px;height:54px;border-radius:18px;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;margin:0 auto;box-shadow:0 8px 20px rgba(140,106,79,.35)}
.fab svg{width:26px;height:26px;stroke:#fff}

/* calendario */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calhead h2{font-size:20px;text-transform:capitalize}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
.day{aspect-ratio:1/1.05;border-radius:12px;border:1px solid transparent;background:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:7px;gap:4px;font-weight:600;font-size:14px}
.day.out{color:#C9BCAE}
.day.today{border-color:var(--accent);color:var(--accent)}
.day.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.day.sel .dots i{background:#fff}
.dots{display:flex;gap:2px;height:6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.dots i.ok{background:var(--ok)}
.calbox{background:var(--sand);border-radius:var(--r);padding:10px;margin-bottom:18px}
.monthstats{display:flex;gap:8px;margin-bottom:14px}
.stat{flex:1;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:22px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);font-weight:600}

/* pacientes */
.plist{display:flex;flex-direction:column}
.prow{display:flex;gap:12px;align-items:center;padding:12px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.prow .grow{flex:1;min-width:0}
.prow .nombre{font-weight:700}
.chev{width:18px;height:18px;stroke:var(--muted);flex:none}

/* perfil */
.phead{display:flex;gap:14px;align-items:center;margin:4px 0 14px}
.phead h1{font-size:22px;line-height:1.2}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.quick div{background:var(--sand);border-radius:12px;padding:9px 10px}
.quick b{display:block;font-size:14px}
.quick span{font-size:11px;color:var(--muted);font-weight:700}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600;margin-bottom:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px 14px;padding:2px 18px;position:sticky;top:0;background:var(--bg);z-index:5;padding-top:8px;padding-bottom:8px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:13px;color:var(--muted)}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.card{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--bg)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fields .full{grid-column:1/-1}
.fields dt{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.fields dd{margin:2px 0 0;font-weight:600;word-break:break-word}
.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px}
.sectionhead h3{font-size:16px}
.list{display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:flex;gap:10px;align-items:flex-start}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:700}
.item .d{font-size:13px;color:var(--muted)}
.item p{margin:4px 0 0;white-space:pre-wrap}
.amt{font-weight:700;white-space:nowrap}
.totals{background:var(--sand);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.totals b{display:block;font-family:var(--display);font-size:17px}
.totals span{font-size:11px;color:var(--muted);font-weight:700}
.mini{border:0;background:var(--sand);border-radius:9px;height:30px;padding:0 10px;font-size:12px;font-weight:700;color:var(--accent)}

/* odontograma */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sand);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{height:36px;border:0;border-radius:10px;background:none;font-weight:700;font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--bg);color:var(--ink);box-shadow:0 1px 4px rgba(60,40,20,.1)}
.seg .cnt{background:var(--accent);color:#fff;border-radius:99px;font-size:10px;padding:1px 6px}
.odohead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.seg button:disabled{opacity:.45}
.seg .lock{width:13px;height:13px}
.dent{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dent button{height:30px;padding:0 11px;border:0;background:var(--bg);font-size:12px;font-weight:700;color:var(--muted)}
.dent button+button{border-left:1px solid var(--line)}
.dent button.on{background:var(--accent-soft);color:var(--accent)}
.odo{background:var(--sand);border-radius:var(--r);padding:10px 4px;margin:0 -10px}
.ogrid{display:grid;gap:1px;align-items:end}
.ogrid.g16{grid-template-columns:repeat(8,minmax(0,1fr)) 5px repeat(8,minmax(0,1fr))}
.ogrid.g10{grid-template-columns:repeat(5,minmax(0,1fr)) 6px repeat(5,minmax(0,1fr));max-width:330px;margin:0 auto;gap:4px}
.ogrid.dec{margin-top:6px}
.ogrid .mid{align-self:stretch;width:2px;background:var(--beige);border-radius:2px;justify-self:center}
.tooth{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;cursor:pointer;border-radius:5px;padding:1px 0}
.tooth .n{font-size:9px;font-weight:700;color:var(--muted);line-height:1}
.odo.big .tooth .n{font-size:11px}
.tooth svg{width:100%;max-width:40px;height:auto;aspect-ratio:1;display:block}
.tooth svg .s{fill:#fff;stroke:#BFAF9C;stroke-width:1.4}
.tooth svg .s.caries,.bigtooth svg .s.caries{fill:var(--red)}
.tooth svg .s.obt,.bigtooth svg .s.obt{fill:var(--blue)}
.tooth svg .s.cur,.bigtooth svg .s.cur{fill:var(--green)}
.tchip .chk{width:14px;height:14px;flex:none}
.tooth.ausente svg .s{fill:#F3EFEA}
.tooth.hit{background:var(--accent-soft);outline:1.5px solid var(--accent)}
.archgap{height:12px}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:12px;color:var(--muted);margin:6px 0 14px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hallbtn{background:var(--bg);width:100%;align-items:center}
.bigtooth{position:relative;width:190px;height:190px;margin:4px auto 0;padding:20px}
.bigtooth svg{width:150px;height:150px;display:block}
.bigtooth svg .s{fill:#fff;stroke:#BFAF9C;stroke-width:.8;cursor:pointer}
.bigtooth .fl{position:absolute;font-size:12px;font-weight:700;color:var(--muted)}
.fl.t{top:0;left:50%;transform:translateX(-50%)}.fl.b{bottom:0;left:50%;transform:translateX(-50%)}.fl.l{left:2px;top:50%;transform:translateY(-50%)}.fl.r{right:2px;top:50%;transform:translateY(-50%)}
.tchip{display:flex;align-items:center;gap:6px}.tchip i{width:11px;height:11px;border-radius:3px;border:1px solid #BFAF9C}
.chg{font-size:14px;font-weight:600;margin-top:3px;padding-left:12px;position:relative}
.chg::before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:50%;background:var(--muted)}
.chg.ok{color:var(--ok)}.chg.ok::before{background:var(--ok)}
.chg.bad{color:var(--red)}.chg.bad::before{background:var(--red)}
.fechas{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px 10px;padding:0 18px}
.fechas::-webkit-scrollbar{display:none}
.fechas button{flex:none;width:58px;height:58px;border-radius:14px;border:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.fechas button b{font-family:var(--display);font-size:19px}
.fechas button span{font-size:11px;color:var(--muted);font-weight:700}
.fechas button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.fechas button.on span{color:#fff}

/* hojas */
.scrim{position:fixed;inset:0;background:rgba(40,28,18,.32);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .22s ease}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.sheet .hd h2{font-size:19px}
.sheet .bd{padding:14px 18px calc(env(safe-area-inset-bottom) + 18px);overflow-y:auto}
.grab{width:40px;height:4px;border-radius:4px;background:var(--beige);margin:8px auto 0}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.scrim,.sheet{animation:none}}

.ctrlrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:6px}
.ctrlrow .chip{padding:0 4px;font-size:13px;height:38px}
.citaacc{display:flex;flex-direction:column;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.cancelbtn{flex-direction:column;height:auto;padding:10px 14px;gap:2px;color:var(--warn);border-color:var(--warn-soft)}
.cancelbtn small{font-size:12px;font-weight:500;color:var(--muted)}
.delbtn{color:var(--warn);font-size:13px;padding:6px 0;align-self:center;text-decoration:underline;text-underline-offset:3px}
form .f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
form .f.resalta input{border-color:var(--accent);background:var(--accent-soft)}
form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:12px;font-weight:700;color:var(--muted)}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=time],input[type=number],input:not([type]),select,textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--sand);padding:10px 12px;font-size:16px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:600}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.picked{display:flex;align-items:center;gap:10px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:8px 10px}
.picked .grow{flex:1;font-weight:700}
.suggest{border:1px solid var(--line);border-radius:12px;margin-top:6px;overflow:hidden}
.suggest button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--bg);padding:10px 12px}
.suggest button:last-child{border-bottom:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-bottom:14px}
.kv dt{color:var(--muted);font-size:13px;font-weight:600}
.kv dd{margin:0;font-weight:600}
.stack{display:flex;flex-direction:column;gap:8px}
.gcaviso{display:block;width:100%;text-align:left;border:0;font:inherit;color:var(--accent);background:var(--accent-soft)}
.notice{font-size:12px;color:var(--muted);background:var(--sand);border-radius:10px;padding:8px 12px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;max-width:90%;text-align:center}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.footnote{margin-top:22px;text-align:center}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script>
/* Actualización automática: al abrir o volver a la app, si hay una versión nueva se recarga sola */
const APP_VERSION = "2026.11.18-1016";
let recargaPendiente = false;
async function buscarActualizacion(){
  if (!/^https?:$/.test(location.protocol) || (window.claude && typeof window.claude.use === "function")) return;
  try {
    const r = await fetch("version.json?t=" + Date.now(), {cache:"no-store"});
    if (!r.ok) return;
    const v = (await r.json()).version;
    if (!v || v === APP_VERSION) return;
    const k = "ov-actualizado-" + v;
    try { if (sessionStorage.getItem(k)) return; sessionStorage.setItem(k, "1"); } catch(e){}
    await fetch(location.pathname, {cache:"reload"}).catch(()=>{});
    if (document.querySelector(".scrim")) recargaPendiente = true; else location.reload();
  } catch(e){}
}
buscarActualizacion();
["gesturestart","gesturechange","gestureend"].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), {passive:false}));
document.addEventListener("touchmove", e => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, {passive:false});
let ultimoToque = 0;
document.addEventListener("touchend", e => { const ahora = Date.now(); if (ahora - ultimoToque < 300 && !e.target.closest("input,textarea,select")) e.preventDefault(); ultimoToque = ahora; }, {passive:false});
try { screen.orientation && screen.orientation.lock && screen.orientation.lock("portrait").catch(()=>{}); } catch(e){}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") buscarActualizacion(); });

/* ---------- utilidades ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,"0");
const toStr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const todayStr = () => toStr(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return toStr(d); };
const addMonths = (s, n) => { const d = parse(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); d.setDate(Math.min(day,last)); return toStr(d); };
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const fmtLong = s => { const d = parse(s); return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`; };
const fmtShort = s => { if(!s) return "—"; const d = parse(s); return `${d.getDate()} ${MESES[d.getMonth()].slice(0,3)} ${d.getFullYear()}`; };
const money = n => "S/ " + (Number(n)||0).toLocaleString("es-PE",{minimumFractionDigits:2, maximumFractionDigits:2});
const initials = n => (n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const age = nac => { if(!nac) return null; const b = parse(nac), t = new Date(); let a = t.getFullYear()-b.getFullYear(); if (t.getMonth()<b.getMonth() || (t.getMonth()===b.getMonth() && t.getDate()<b.getDate())) a--; return a; };
const minutes = h => { const [a,b] = (h||"0:0").split(":").map(Number); return a*60+b; };
const norm = s => (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const ICON = {
  addUser:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><circle cx="10" cy="8.5" r="3.5"/><path d="M3.5 20c.6-3.4 3.2-5.5 6.5-5.5 1.5 0 2.9.4 4 1.2M18 14v6M15 17h6"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
};
const TIPOS_PAGO = ["Efectivo","Yape","Plin","Transferencia"];
const MOTIVOS = ["Evaluación","Limpieza","Curación","Endodoncia","Extracción","Control de ortodoncia","Blanqueamiento","Prótesis","Control"];
const ESTADOS = {programada:["Programada",""], atendida:["Atendida","ok"], no_asistio:["No asistió","warn"], cancelada:["Cancelada","muted"]};

/* ---------- almacenamiento ---------- */
const S = { pacientes:{}, citas:{}, ready:false, mode:null, offline:false };
const UI = { route:"hoy", dia:todayStr(), mes:todayStr().slice(0,8)+"01", calSel:todayStr(), tab:"datos", odoModo:"", q:"", pq:"" };
let DB = null;
const PATH = { pacientes:"clinica/main/pacientes", citas:"clinica/main/citas" };
const LSKEY = "consultorio-valeria-v1";
const writing = {};

let LS_OK = true;
try { localStorage.setItem(LSKEY+"-t","1"); localStorage.removeItem(LSKEY+"-t"); } catch(e){ LS_OK = false; }
function localLoad(){ try { const d = JSON.parse(localStorage.getItem(LSKEY)||"{}"); S.pacientes = d.pacientes||{}; S.citas = d.citas||{}; } catch(e){} }
function localSave(){ try { localStorage.setItem(LSKEY, JSON.stringify({pacientes:S.pacientes, citas:S.citas})); } catch(e){} }

async function queueWrite(kind, id, data){
  const key = kind+"/"+id;
  const w = writing[key] || (writing[key] = {busy:false, has:false, next:null});
  w.next = data; w.has = true;
  if (w.busy) return;
  w.busy = true;
  while (w.has){
    const d = w.next; w.has = false;
    const ref = DB.collection(PATH[kind]).doc(id);
    try { if (d === null) await ref.delete(); else await ref.set(d); }
    catch(e){
      if (e && e.code === "unavailable"){ await new Promise(r=>setTimeout(r, 600+Math.random()*800)); try{ if(d===null) await ref.delete(); else await ref.set(d);}catch(e2){ toast("No se pudo guardar. Revisa tu conexión."); } }
      else if (e && e.code === "quota_exceeded") toast("Se llenó el espacio de datos. Elimina registros antiguos.");
      else toast("No se pudo guardar este cambio.");
    }
  }
  w.busy = false;
}
function save(kind, id, data){
  data = JSON.parse(JSON.stringify(data));
  data.actualizado = Date.now();
  S[kind][id] = data;
  if (S.mode === "db") queueWrite(kind, id, data); else localSave();
  gcProgramar();
  render();
}
function removeDoc(kind, id){
  delete S[kind][id];
  if (S.mode === "db") queueWrite(kind, id, null); else localSave();
  gcProgramar();
  render();
}

async function boot(){
  const hasClaude = typeof window.claude === "object" && window.claude && typeof window.claude.use === "function";
  if (hasClaude){
    try { DB = await window.claude.use("db"); } catch(e){ DB = null; }
  }
  if (!DB){ S.mode = "local"; localLoad(); try { const u = localStorage.getItem(LSKEY+"-copia"); if (u) S.ultimaCopia = fmtShort(u); } catch(e){} S.ready = true; render(); return; }
  S.mode = "db";
  let got = {pacientes:false, citas:false};
  const timer = setTimeout(()=>{ if(!S.ready){ S.ready = true; S.offline = true; render(); } }, 10000);
  for (const kind of ["pacientes","citas"]){
    DB.collection(PATH[kind]).onSnapshot(snap => {
      const m = {};
      snap.docs.forEach(d => { m[d.id] = JSON.parse(JSON.stringify(d.data())); });
      // conserva escrituras propias aún en cola
      for (const k in writing){ if (k.startsWith(kind+"/") && (writing[k].busy)){ const id = k.split("/")[1]; if (S[kind][id]) m[id] = S[kind][id]; else delete m[id]; } }
      S[kind] = m;
      if (!snap.metadata.fromCache){ got[kind] = true; if (got.pacientes && got.citas){ clearTimeout(timer); S.offline = false; } }
      if (got.pacientes && got.citas) S.ready = true;
      if (S.ready) render();
    }, err => { clearTimeout(timer); S.ready = true; S.offline = true; render(); });
  }
}

/* ---------- consultas ---------- */
const pacientesOrden = () => Object.entries(S.pacientes).map(([id,p])=>({id,...p})).sort((a,b)=>norm(a.nombre).localeCompare(norm(b.nombre)));
const citasDe = fecha => Object.entries(S.citas).map(([id,c])=>({id,...c})).filter(c=>c.fecha===fecha).sort((a,b)=>minutes(a.hora)-minutes(b.hora));
const citasPaciente = pid => Object.entries(S.citas).map(([id,c])=>({id,...c})).filter(c=>c.pacienteId===pid).sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));
const pacNombre = id => S.pacientes[id]?.nombre || "Paciente eliminado";
function buscar(q){
  const t = norm(q).trim(); if (!t) return [];
  return pacientesOrden().filter(p => norm(p.nombre).includes(t) || (p.dni||"").includes(t) || (p.telefono||"").replace(/\s/g,"").includes(t.replace(/\s/g,""))).slice(0,8);
}
function proximaCita(pid){ const hoy = todayStr(); return citasPaciente(pid).find(c => c.fecha >= hoy && c.estado === "programada"); }
function ultimaVisita(pid){ const hoy = todayStr(); return citasPaciente(pid).filter(c=>c.fecha<=hoy && c.estado==="atendida").pop(); }

/* ---------- router ---------- */
function readHash(){
  const h = location.hash.replace("#","");
  if (h.startsWith("paciente-")){ const id = h.slice(9); if (UI.route !== "paciente" || UI.pid !== id){ UI.tab = "datos"; UI.odoModo = ""; } UI.route = "paciente"; UI.pid = id; }
  else if (["hoy","calendario","pacientes","ajustes"].includes(h)) UI.route = h;
  else UI.route = "hoy";
}
window.addEventListener("hashchange", ()=>{ readHash(); render(); window.scrollTo(0,0); });
function go(h){ if (location.hash === "#"+h){ readHash(); render(); } else location.hash = h; }

/* ---------- render ---------- */
function render(){
  const app = $("#app");
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("on", a.dataset.nav === UI.route || (UI.route==="paciente" && a.dataset.nav==="pacientes")));
  if (!S.ready){ return; }
  const act = document.activeElement; const fid = act && act.id; const sel = act && act.selectionStart;
  let html = "";
  if (UI.route === "hoy") html = vHoy();
  else if (UI.route === "calendario") html = vCal();
  else if (UI.route === "pacientes") html = vPacientes();
  else if (UI.route === "paciente") html = vPerfil();
  else if (UI.route === "ajustes") html = vAjustes();
  app.innerHTML = html;
  if (fid){ const el = document.getElementById(fid); if (el && el.focus){ el.focus(); try{ el.setSelectionRange(sel, sel); }catch(e){} } }
}

function notices(){
  let n = "";
  if (S.mode === "local" && !LS_OK) n += `<div class="notice">Este navegador no permite guardar datos (modo incógnito o privado). Los cambios se perderán al cerrar la página.</div>`;
  if (S.offline) n += `<div class="notice">No se pudo conectar para cargar los datos. Lo que ves puede no estar actualizado.</div>`;
  return n;
}

function searchBox(){
  const r = UI.q ? buscar(UI.q) : null;
  return `<div class="search">${ICON.search}<input id="q" type="search" placeholder="Buscar paciente por nombre o DNI" autocomplete="off" value="${esc(UI.q)}" aria-label="Buscar paciente">
  ${r ? `<div class="results">${r.length ? r.map(p=>`<button data-open="${p.id}"><span class="avatar">${esc(initials(p.nombre))}</span><span><b>${esc(p.nombre)}</b><div class="sub">${p.dni?"DNI "+esc(p.dni):""}${p.telefono?" · "+esc(p.telefono):""}</div></span></button>`).join("") : `<div class="empty">Ningún paciente coincide. <button class="link" data-act="nuevoPac">Registrar “${esc(UI.q)}”</button></div>`}</div>` : ""}
  </div>`;
}

function citaCard(c, opts={}){
  const now = new Date(); const isToday = c.fecha === todayStr();
  const m = now.getHours()*60+now.getMinutes();
  const enCurso = isToday && c.estado==="programada" && m >= minutes(c.hora) && m < minutes(c.hora)+(Number(c.duracion)||30);
  const [lbl, cls] = ESTADOS[c.estado] || ESTADOS.programada;

/* odontograma: notación FDI */
const UP = [18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28];
const LOW = [48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];
const UPD = [55,54,53,52,51,61,62,63,64,65];
const LOWD = [85,84,83,82,81,71,72,73,74,75];
const CARA_T = [["caries","Caries","var(--red)"],["obt","Obturación","var(--blue)"],["cur","Curada","var(--green)"],["sano","Sana","#fff"]];
const EST_T = [["endo","Endodoncia"],["corona","Corona"],["ext","Extracción indicada"],["ausente","Ausente"]];
const EST_N = {endo:"endodoncia",corona:"corona",ext:"extracción indicada",ausente:"ausente"};
const CARA_N = {caries:"caries",obt:"obturación",cur:"curada"};
const CARAS = {V:"vestibular",L:"lingual/palatina",M:"mesial",D:"distal",O:"oclusal/incisal"};
const DENT = [["adulto","Adulto"],["mixto","Mixto"],["nino","Niño"]];
function geo(n){
  const q = Math.floor(n/10), upper = [1,2,5,6].includes(q);
  const right = [1,4,5,8].includes(q) ? "M" : "D", left = right==="M" ? "D" : "M";
  return {top: upper?"V":"L", bottom: upper?"L":"V", left, right};
}
function nombrePieza(n){
  n = +n; const q = Math.floor(n/10), d = n%10, dec = q>=5;
  const tipo = dec ? ["","incisivo central","incisivo lateral","canino","primer molar","segundo molar"][d] : ["","incisivo central","incisivo lateral","canino","primer premolar","segundo premolar","primer molar","segundo molar","tercer molar"][d];
  const lado = [1,5].includes(q)?"superior derecho":[2,6].includes(q)?"superior izquierdo":[3,7].includes(q)?"inferior izquierdo":"inferior derecho";
  return `${tipo} ${lado}${dec?" (deciduo)":""}`;
}
function toothSVG(n, t){
  const g = geo(n), c = (t&&t.caras)||{}, e = (t&&t.estado)||{};
  const cl = k => `s ${c[k]||""}`;
  let over = "";
  if (e.endo) over += `<line x1="20" y1="-2" x2="20" y2="42" stroke="var(--blue)" stroke-width="3"/>`;
  if (e.corona) over += `<circle cx="20" cy="20" r="18.5" fill="none" stroke="var(--blue)" stroke-width="2.5"/>`;
  if (e.ext) over += `<path d="M4 4L36 36M36 4L4 36" stroke="var(--red)" stroke-width="3.5" stroke-linecap="round"/>`;
  if (e.ausente) over += `<path d="M4 4L36 36M36 4L4 36" stroke="var(--blue)" stroke-width="3.5" stroke-linecap="round"/>`;
  return `<svg viewBox="-1 -1 42 42" aria-hidden="true">
    <polygon class="${cl(g.top)}" data-s="${g.top}" points="0,0 40,0 27,13 13,13"/>
    <polygon class="${cl(g.bottom)}" data-s="${g.bottom}" points="0,40 40,40 27,27 13,27"/>
    <polygon class="${cl(g.left)}" data-s="${g.left}" points="0,0 13,13 13,27 0,40"/>
    <polygon class="${cl(g.right)}" data-s="${g.right}" points="40,0 27,13 27,27 40,40"/>
    <rect class="${cl("O")}" data-s="O" x="13" y="13" width="14" height="14"/>
    <g pointer-events="none">${over}</g></svg>`;
}
function denticionDe(p){
  if (p.denticion) return p.denticion;
  const a = age(p.nacimiento);
  return a===null ? "adulto" : a < 6 ? "nino" : a < 13 ? "mixto" : "adulto";
}
const vacio = t => !t || (!Object.keys(t.caras||{}).length && !Object.keys(t.estado||{}).length && !t.nota);
const mismo = (a,b) => JSON.stringify(a||null) === JSON.stringify(b||null);
/* Dibuja el odontograma completo, ajustado al ancho (sin deslizar) */
function odoGrid(o, dent, opts={}){
  const mark = opts.mark || new Set();
  const cell = (n, numTop) => `<div class="tooth ${o[n]?.estado?.ausente?"ausente":""} ${mark.has(String(n))?"hit":""}" ${opts.ro?"":`data-t="${n}" role="button" tabindex="0"`} aria-label="Pieza ${n}">${numTop?`<span class="n">${n}</span>`:""}${toothSVG(n,o[n])}${numTop?"":`<span class="n">${n}</span>`}</div>`;
  const blank = '<div></div>';
  const perm = (arr, top) => arr.slice(0,8).map(n=>cell(n,top)).join("") + '<div class="mid"></div>' + arr.slice(8).map(n=>cell(n,top)).join("");
  const decAligned = (arr, top) => blank.repeat(3) + arr.slice(0,5).map(n=>cell(n,top)).join("") + '<div class="mid"></div>' + arr.slice(5).map(n=>cell(n,top)).join("") + blank.repeat(3);
  const dec = (arr, top) => arr.slice(0,5).map(n=>cell(n,top)).join("") + '<div class="mid"></div>' + arr.slice(5).map(n=>cell(n,top)).join("");
  let rows;
  if (dent === "nino") rows = `<div class="ogrid g10">${dec(UPD,true)}</div><div class="archgap"></div><div class="ogrid g10">${dec(LOWD,false)}</div>`;
  else if (dent === "mixto") rows = `<div class="ogrid g16">${perm(UP,true)}</div><div class="ogrid g16 dec">${decAligned(UPD,false)}</div><div class="archgap"></div><div class="ogrid g16 dec">${decAligned(LOWD,true)}</div><div class="ogrid g16">${perm(LOW,false)}</div>`;
  else rows = `<div class="ogrid g16">${perm(UP,true)}</div><div class="archgap"></div><div class="ogrid g16">${perm(LOW,false)}</div>`;
  return `<div class="odo ${dent==="nino"?"big":""}" id="odo">${rows}</div>`;
}
function descPieza(t){
  const parts = []; if (!t) return "sin hallazgos";
  const cs = Object.entries(t.caras||{});
  const car = cs.filter(([,v])=>v==="caries").map(([k])=>k), ob = cs.filter(([,v])=>v==="obt").map(([k])=>k);
  if (car.length) parts.push(`caries ${car.join("")}`); if (ob.length) parts.push(`obturación ${ob.join("")}`);
  const cu = cs.filter(([,v])=>v==="cur").map(([k])=>k); if (cu.length) parts.push(`curada ${cu.join("")}`);
  Object.keys(t.estado||{}).forEach(k => parts.push(EST_N[k]));
  return parts.length ? parts.join(" · ") : "sin hallazgos";
}
/* Odontograma inicial (se fija una vez) y evolución (se modifica) */
function odoInicial(p){
  if (p.odoInicial) return p.odoInicial;
  // pacientes de versiones anteriores: lo que ya tenían queda como inicial fijado
  if (!vacioOdo(p.odontograma)) return {odontograma: p.odontograma, fijado: true, fecha: null};
  return {odontograma: {}, fijado: false};
}
const vacioOdo = o => !o || !Object.keys(o).some(n => !vacio(o[n]));
function tOdo(p){
  const ini = odoInicial(p); const dent = denticionDe(p);
  const modo = ini.fijado ? (UI.odoModo || "evol") : "inicial";
  const seg = `<div class="seg" role="tablist"><button class="${modo==="inicial"?"on":""}" data-odomodo="inicial">Inicial${ini.fijado?` <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>`:""}</button><button class="${modo==="evol"?"on":""}" data-odomodo="evol" ${ini.fijado?"":"disabled"}>Evolución</button></div>`;
  const dentSel = "";
  const legend = `<div class="legend"><span><i class="sw" style="background:var(--red)"></i>Caries</span><span><i class="sw" style="background:var(--blue)"></i>Obturación</span><span><i class="sw" style="background:var(--green)"></i>Curada</span></div>`;
  if (modo === "inicial"){
    if (ini.fijado) return seg + dentSel + odoGrid(ini.odontograma||{}, dent, {ro:true}) + legend + `<div class="hint" style="margin-top:0">Registrado${ini.fecha?" el "+fmtShort(ini.fecha):""}. No se puede modificar; los cambios se hacen en Evolución.</div>`;
    return `${seg}<div class="notice" style="margin-bottom:10px">Registra cómo llegó el paciente. Al terminar, toca “Guardar odontograma inicial”: quedará fijo y los cambios siguientes se harán en Evolución.</div>
      ${dentSel}${odoGrid(ini.odontograma||{}, dent)}${legend}
      <button class="btn primary block" data-act="fijarInicial" style="margin-top:4px">Guardar odontograma inicial</button>`;
  }
  return seg + dentSel + odoGrid(p.odontograma||{}, dent) + legend;
}
/* Editor de una pieza: modifica el inicial (si aún no está fijado) o la evolución */
function editarPieza(n){
  const p = S.pacientes[UI.pid]; if (!p) return;
  const ini = odoInicial(p);
  const enInicial = !ini.fijado;
  const fuente = enInicial ? (ini.odontograma||{}) : (p.odontograma||{});
  const orig = fuente[n];
  const d = JSON.parse(JSON.stringify(orig || {caras:{},estado:{}})); d.caras ||= {}; d.estado ||= {};
  let tool = "caries";
  const draw = bd => {

  };
  openSheet(`Pieza ${n}`, `<div class="sub" style="margin:-4px 0 12px">${nombrePieza(n).replace(/^./,c=>c.toUpperCase())}${enInicial?" · odontograma inicial":""}</div>

let sheetEl = null;
function openSheet(title, body, onMount){
  closeSheet();
  sheetEl = document.createElement("div");
  sheetEl.className = "scrim";
  sheetEl.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div><div class="hd"><h2>${esc(title)}</h2><button class="iconbtn" data-close aria-label="Cerrar">${ICON.close}</button></div><div class="bd">${body}</div></div>`;
  sheetEl.addEventListener("click", e => { if (e.target === sheetEl || e.target.closest("[data-close]")) closeSheet(); });
  document.body.appendChild(sheetEl);
  document.body.style.overflow = "hidden";
  onMount && onMount($(".bd", sheetEl));
}
function closeSheet(){ if (sheetEl){ sheetEl.remove(); sheetEl = null; document.body.style.overflow = ""; if (recargaPendiente) location.reload(); } }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
let toastT;
function toast(msg){ let t = $(".toast"); if (!t){ t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); document.body.appendChild(t); } t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(()=>t.remove(), 2600); }

/* ---------- Google Calendar (una vía: app → calendario "Consultorio") ---------- */
const GCAL_CLIENT_ID = "420021930532-ql859se5rf2u6ar12cec85fgo2esvqoj.apps.googleusercontent.com";   // ID de cliente OAuth de Google Cloud (pendiente de configurar)
const GCAL_SCOPE = "https://www.googleapis.com/auth/calendar.app.created https://www.googleapis.com/auth/calendar.calendarlist email";
const GCAL_COLOR = {backgroundColor: "#EFE5D7", foregroundColor: "#33291F"};  // crema de la app con texto oscuro
const GCAL_KEY = "ov-gcal";
const GC = { estado: null, tokenClient: null, syncing: false, again: false, timer: null, error: "" };
function gcLoad(){ try { return JSON.parse(localStorage.getItem(GCAL_KEY) || "null"); } catch(e){ return null; } }
function gcSave(st){ try { localStorage.setItem(GCAL_KEY, JSON.stringify(st)); } catch(e){} }
GC.estado = gcLoad();
const gcDisponible = () => !!GCAL_CLIENT_ID && S.mode === "local" && /^https:$/.test(location.protocol);
const gcConectado = () => !!(GC.estado && GC.estado.calendarId && !GC.estado.desconectado);
const gcTokenVivo = () => !!(GC.estado && GC.estado.token && GC.estado.exp > Date.now() + 60000);
function gcCargarScript(){
  return new Promise((ok, mal) => {
    if (window.google && google.accounts && google.accounts.oauth2) return ok();
    const s = document.createElement("script"); s.src = "https://accounts.google.com/gsi/client"; s.async = true;
    s.onload = () => ok(); s.onerror = () => mal(new Error("gsi")); document.head.appendChild(s);
  });
}
async function gcPrepararCliente(){
  await gcCargarScript();
  if (!GC.tokenClient) GC.tokenClient = google.accounts.oauth2.initTokenClient({client_id: GCAL_CLIENT_ID, scope: GCAL_SCOPE, callback: () => {}});
}
/* Pide permiso a Google. Debe llamarse desde un toque de Valeria. */
function gcPedirToken(hint){
  return new Promise((ok, mal) => {
    GC.tokenClient.callback = r => { if (r.error){ mal(new Error(r.error)); return; } ok(r); };
    GC.tokenClient.error_callback = e => mal(new Error(e.type || "popup"));
    GC.tokenClient.requestAccessToken({prompt: hint ? "" : "consent", login_hint: hint || undefined});
  });
}
async function gcApi(method, path, body){
  const r = await fetch("https://www.googleapis.com/calendar/v3/" + path, {method, headers: {"Authorization": "Bearer " + GC.estado.token, "Content-Type": "application/json"}, body: body ? JSON.stringify(body) : undefined});
  if (r.status === 401){ GC.estado.exp = 0; gcSave(GC.estado); throw Object.assign(new Error("auth"), {status:401}); }
  if (!r.ok && r.status !== 204) throw Object.assign(new Error("api " + r.status), {status: r.status});
  return r.status === 204 ? null : r.json().catch(() => null);
}
async function gcConectar(){
  if (!GCAL_CLIENT_ID){ toast("Falta configurar Google Calendar."); return; }
  try {
    await gcPrepararCliente();
    const r = await gcPedirToken(GC.estado && GC.estado.email);
    const st = GC.estado || {map:{}}; delete st.desconectado;
    st.token = r.access_token; st.exp = Date.now() + (r.expires_in || 3600) * 1000; st.map ||= {}; st.scopes = r.scope || ""; delete st.color;
    GC.estado = st;
    try { const u = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {headers:{Authorization:"Bearer "+st.token}}).then(x=>x.json()); if (u.email) st.email = u.email; } catch(e){}
    // reutiliza el calendario si sigue existiendo; si no, crea "Consultorio"
    let calOk = false;
    if (st.calendarId){ try { await gcApi("GET", "calendars/" + encodeURIComponent(st.calendarId)); calOk = true; } catch(e){ if (e.status === 401) throw e; } }
    if (!calOk){
      const cal = await gcApi("POST", "calendars", {summary: "Consultorio", description: "Citas de OdontoVale", timeZone: "America/Lima"});
      st.calendarId = cal.id; st.map = {}; st.desde = todayStr();
    }
    gcSave(st); GC.error = ""; render(); toast("Google Calendar conectado");
    gcSincronizar();
  } catch(e){
    GC.error = "No se pudo conectar. Intenta de nuevo."; render();
    if (!/popup_closed|access_denied/.test(e.message)) toast(GC.error);
  }
}
function gcDesconectar(){
  try { if (GC.estado && GC.estado.token && window.google) google.accounts.oauth2.revoke(GC.estado.token, () => {}); } catch(e){}
  if (GC.estado){ delete GC.estado.token; delete GC.estado.exp; GC.estado.desconectado = true; gcSave(GC.estado); }
  render(); toast("Google Calendar desconectado");
}
/* ID de evento fijo por cita: si algo se pierde, no se duplican */
function gcEventId(citaId){ return "ov" + Array.from(new TextEncoder().encode(citaId)).map(b => b.toString(16).padStart(2,"0")).join(""); }
function gcEvento(c){
  const p = S.pacientes[c.pacienteId] || {};
  const ini = minutes(c.hora), fin = ini + (Number(c.duracion) || 30);
  const hm = m => `${pad(Math.floor(m/60) % 24)}:${pad(m % 60)}`;
  const fechaFin = fin >= 1440 ? addDays(c.fecha, 1) : c.fecha;
  const desc = [p.telefono ? "Teléfono: " + p.telefono : "", p.alergias ? "Alergias: " + p.alergias : "", c.notas ? "Notas: " + c.notas : "", c.estado === "atendida" ? "Estado: atendida" : "", "Agendada en OdontoVale"].filter(Boolean).join("\n");
  return {
    summary: `${c.estado === "atendida" ? "✓ " : ""}${p.nombre || "Paciente"} · ${c.motivo || "Consulta"}`,
    description: desc,
    start: {dateTime: `${c.fecha}T${hm(ini)}:00`, timeZone: "America/Lima"},
    end: {dateTime: `${fechaFin}T${hm(fin)}:00`, timeZone: "America/Lima"},
    status: "confirmed",
  };
}
function gcProgramar(){ if (!gcConectado()) return; clearTimeout(GC.timer); GC.timer = setTimeout(gcSincronizar, 1200); }
/* Deja el calendario igual a la app: crea, actualiza o borra lo necesario */
async function gcSincronizar(){
  if (!gcDisponible() || !gcConectado() || !gcTokenVivo()) { render(); return; }
  if (GC.syncing){ GC.again = true; return; }
  GC.syncing = true; GC.again = false;
  const st = GC.estado; st.map ||= {};
  try {
    const deseadas = {};
    for (const [id, c] of Object.entries(S.citas)){
      if (!["programada","atendida"].includes(c.estado)) continue;
      if (!st.map[id] && c.fecha < todayStr()) continue;
      deseadas[id] = gcEvento(c);
    }
    if (st.color !== GCAL_COLOR.backgroundColor){
      try { await gcApi("PATCH", "users/me/calendarList/" + encodeURIComponent(st.calendarId) + "?colorRgbFormat=true", GCAL_COLOR); st.color = GCAL_COLOR.backgroundColor; gcSave(st); } catch(e){ if (e.status === 401) throw e; }
    }
    const cal = "calendars/" + encodeURIComponent(st.calendarId) + "/events";
    for (const [id, ev] of Object.entries(deseadas)){
      const h = JSON.stringify(ev); const eid = gcEventId(id);
      if (st.map[id] && st.map[id].h === h) continue;
      try {
        if (st.map[id]) await gcApi("PATCH", `${cal}/${eid}`, ev);
        else await gcApi("POST", cal, {...ev, id: eid});
      } catch(e){
        if (e.status === 409 || e.status === 404 || e.status === 410){
          if (e.status === 409) await gcApi("PATCH", `${cal}/${eid}`, ev); else await gcApi("POST", cal, {...ev, id: eid});
        } else throw e;
      }
      st.map[id] = {h}; gcSave(st);
    }
    for (const id of Object.keys(st.map)){
      if (deseadas[id]) continue;
      try { await gcApi("DELETE", `${cal}/${gcEventId(id)}`); } catch(e){ if (![404,410].includes(e.status)) throw e; }
      delete st.map[id]; gcSave(st);
    }
    st.ultima = Date.now(); GC.error = ""; gcSave(st);
  } catch(e){
    GC.error = e.status === 401 ? "" : "Algunos cambios no se enviaron. Se reintentará al abrir la app.";
  } finally {
    GC.syncing = false; render();
    if (GC.again) gcProgramar();
  }
}
/* Renovar permiso con un toque (Google lo pide cada cierto tiempo) */
async function gcRenovar(){
  try { await gcPrepararCliente(); const r = await gcPedirToken(GC.estado && GC.estado.email); GC.estado.token = r.access_token; GC.estado.exp = Date.now() + (r.expires_in || 3600) * 1000; if (r.scope) GC.estado.scopes = r.scope; gcSave(GC.estado); render(); gcSincronizar(); }
  catch(e){ if (!/popup_closed|access_denied/.test(e.message)) toast("No se pudo renovar el permiso."); }
}
function gcPendientes(){
  if (!gcConectado()) return 0; const st = GC.estado; let n = 0;
  for (const [id, c] of Object.entries(S.citas)){ if (["programada","atendida"].includes(c.estado) && (st.map[id] || c.fecha >= todayStr())){ if (!st.map[id] || st.map[id].h !== JSON.stringify(gcEvento(c))) n++; } }
  for (const id of Object.keys(st.map)){ const c = S.citas[id]; if (!c || !["programada","atendida"].includes(c.estado)) n++; }
  return n;
}
function gcTarjeta(){
  if (S.mode !== "local") return "";
  const hace = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? "hace un momento" : m < 60 ? `hace ${m} min` : `hace ${Math.round(m/60)} h`; };
  let body;
  if (!GCAL_CLIENT_ID) body = `<div class="sub">Aún falta configurar la conexión con Google. Cuando esté lista, aquí aparecerá el botón para conectar tu cuenta.</div>`;
  else if (!gcConectado()) body = `<div class="sub" style="margin-bottom:12px">Tus citas aparecerán en un calendario “Consultorio” de tu Google Calendar, con sus recordatorios. Los cambios se hacen aquí en la app; lo que borres o muevas en Google no cambia la app.</div><button class="btn sm primary" data-act="gcConectar">Conectar Google Calendar</button>`;
  else {
    const pend = gcPendientes();
    body = `<div class="sub" style="margin-bottom:10px">Conectado${GC.estado.email ? " a <b>" + esc(GC.estado.email) + "</b>" : ""}<br>${GC.syncing ? "Sincronizando…" : pend ? `${pend} ${pend===1?"cambio pendiente":"cambios pendientes"} de enviar` : GC.estado.ultima ? "Al día · última sincronización " + hace(GC.estado.ultima) : "Listo"}</div>
      ${GC.error ? `<div class="notice" style="margin-bottom:10px">${esc(GC.error)}</div>` : ""}
      ${GC.estado.color !== GCAL_COLOR.backgroundColor && !/calendarlist/.test(GC.estado.scopes || "") ? `<div class="notice" style="margin-bottom:10px">Para que el calendario use el color crema, toca <b>Desconectar</b> y luego <b>Conectar Google Calendar</b>, y acepta todos los permisos.</div>` : ""}
      <div class="btnrow">${gcTokenVivo() ? `<button class="btn sm soft" data-act="gcSync">Sincronizar ahora</button>` : `<button class="btn sm primary" data-act="gcRenovar">Continuar sincronizando</button>`}<button class="btn sm" data-act="gcDesconectar">Desconectar</button></div>
      ${gcTokenVivo() ? "" : `<div class="sub" style="font-size:12px;margin-top:8px">Google pide confirmar el permiso cada cierto tiempo. Toca “Continuar sincronizando”.</div>`}`;
  }
  return `<div class="card"><h3 style="font-size:16px;margin-bottom:4px;display:flex;align-items:center;gap:8px"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Google Calendar</h3>${body}</div>`;
}
function gcAviso(){
  if (!gcDisponible() || !gcConectado() || gcTokenVivo() || !gcPendientes()) return "";
  return `<button class="notice gcaviso" data-act="gcRenovar">Hay citas sin enviar a Google Calendar. <b>Toca para continuar sincronizando.</b></button>`;
}

/* ---------- presupuesto en PDF ---------- */
function logoPNG(){
  const c = document.createElement("canvas"); c.width = c.height = 256; const x = c.getContext("2d");
  x.fillStyle = "#8C6A4F"; x.beginPath(); if (x.roundRect) x.roundRect(0,0,256,256,64); else x.rect(0,0,256,256); x.fill();
  x.setTransform(4,0,0,4,0,-10); x.fillStyle = "#fff";
  x.fill(new Path2D("M32 20C29 20 27 18 23 18C18 18 15 22 15 28C15 36 19 40 21 48C22 52 26 52 27 48L29 41C30 38 34 38 35 41L37 48C38 52 42 52 43 48C45 40 49 36 49 28C49 22 46 18 41 18C37 18 35 20 32 20Z"));
  return c.toDataURL("image/png");
}
function presupuestoPDF(p){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"mm", format:"a4"});
  const INK=[51,41,31], MUT=[134,119,106], ACC=[140,106,79], SAND=[248,243,236], LINE=[237,230,220], OK=[94,139,107], WARN=[180,103,79];
  const W = 210, M = 18; let y = 18;
  const S2 = n => "S/ " + (Number(n)||0).toLocaleString("es-PE",{minimumFractionDigits:2, maximumFractionDigits:2});
  try { doc.addImage(logoPNG(), "PNG", M, y, 16, 16); } catch(e){}
  doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.setTextColor(...INK); doc.text("Consultorio Dra. Valeria", M+21, y+7);
  doc.setFont("helvetica","normal"); doc.setFontSize(10.5); doc.setTextColor(...MUT); doc.text("Presupuesto odontológico", M+21, y+13);
  doc.setFontSize(9.5); doc.text(fmtShort(todayStr()), W-M, y+7, {align:"right"});
  y += 24; doc.setDrawColor(...LINE); doc.setLineWidth(.4); doc.line(M, y, W-M, y); y += 9;
  // paciente
  const campo = (lbl, v, x) => { doc.setFontSize(8.5); doc.setTextColor(...MUT); doc.text(lbl.toUpperCase(), x, y); doc.setFontSize(11); doc.setTextColor(...INK); doc.text(v||"—", x, y+5.5); };
  campo("Paciente", p.nombre, M); campo("DNI", p.dni, 120); campo("Teléfono", p.telefono, 155);
  y += 16;
  // tabla
  const cols = [[M,"N°"],[M+12,"Tratamiento"],[118,"Pieza"],[138,"Estado"],[W-M,"Precio"]];
  const head = () => { doc.setFillColor(...SAND); doc.rect(M, y-5.5, W-2*M, 9, "F"); doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(...MUT);
    cols.forEach(([x,t],i) => doc.text(t, i===4?x-3:x+3, y, i===4?{align:"right"}:{})); doc.setFont("helvetica","normal"); y += 9; };
  head();
  const items = p.presupuesto||[];
  items.forEach((it, i) => {
    const lines = doc.splitTextToSize(it.desc||"", 118-(M+12)-6);
    const h = Math.max(1, lines.length)*5 + 4;
    if (y + h > 262){ doc.addPage(); y = 22; head(); }
    doc.setFontSize(10); doc.setTextColor(...INK);
    doc.text(String(i+1), M+3, y); doc.text(lines, M+15, y); doc.text(it.pieza||"—", 121, y);
    doc.setTextColor(...(it.estado==="realizado"?OK:MUT)); doc.text(it.estado==="realizado"?"Realizado":"Pendiente", 141, y);
    doc.setTextColor(...INK); doc.text(S2(it.precio), W-M-3, y, {align:"right"});
    y += h - 4; doc.setDrawColor(...LINE); doc.line(M, y, W-M, y); y += 6;
  });
  if (!items.length){ doc.setFontSize(10); doc.setTextColor(...MUT); doc.text("Sin tratamientos presupuestados.", M+3, y); y += 8; }
  // totales
  const total = items.reduce((s,i)=>s+(+i.precio||0),0), pag = (p.abonos||[]).reduce((s,a)=>s+(+a.monto||0),0);
  if (y + 34 > 280){ doc.addPage(); y = 22; }
  y += 4; const bx = W-M-78;
  doc.setFillColor(...SAND); doc.roundedRect(bx, y, 78, 30, 3, 3, "F");
  const fila = (lbl, v, yy, col, bold) => { doc.setFont("helvetica", bold?"bold":"normal"); doc.setFontSize(bold?11.5:10); doc.setTextColor(...MUT); doc.text(lbl, bx+5, yy); doc.setTextColor(...col); doc.text(v, W-M-5, yy, {align:"right"}); };
  fila("Total presupuesto", S2(total), y+8, INK);
  fila("Pagado", S2(pag), y+15, OK);
  fila("Saldo pendiente", S2(Math.max(total-pag,0)), y+24, total-pag>0?WARN:INK, true);
  doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(...MUT);
  doc.text("Precios en soles. Consultas al mismo número por el que recibiste este documento.", M, 287);
  return doc.output("blob");
}
function telWhatsApp(t){ let d = (t||"").replace(/\D/g,""); if (d.length === 9) d = "51" + d; return d; }
function enviarPresupuesto(){
  const p = S.pacientes[UI.pid]; if (!p) return;
  if (!window.jspdf){ toast("No se pudo cargar el generador de PDF. Revisa tu conexión."); return; }
  if (!(p.presupuesto||[]).length){ toast("Agrega al menos un tratamiento al presupuesto."); return; }
  let blob; try { blob = presupuestoPDF(p); } catch(e){ toast("No se pudo crear el PDF."); return; }
  const nombreArch = `Presupuesto ${p.nombre}.pdf`.replace(/[\\/:*?"<>|]/g,"");
  const file = new File([blob], nombreArch, {type:"application/pdf"});
  const url = URL.createObjectURL(blob);
  const tel = telWhatsApp(p.telefono);
  const msg = `Hola ${p.nombre.split(" ")[0]}, te envío tu presupuesto del Consultorio Dra. Valeria.`;
  const puedeCompartir = !!(navigator.canShare && navigator.canShare({files:[file]}));
  openSheet("Enviar presupuesto", `<div class="item" style="margin-bottom:14px"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="var(--accent)" stroke-width="1.7" stroke-linejoin="round"><path d="M6 2.5h8l4.5 4.5v14.5H6z"/><path d="M14 2.5V7h4.5"/></svg><div class="grow"><div class="t">${esc(nombreArch)}</div><div class="d">${(p.presupuesto||[]).length} tratamientos · ${p.telefono?esc(p.telefono):"sin teléfono registrado"}</div></div></div>
    <div class="stack">
      ${puedeCompartir ? `<button class="btn primary block" id="ep-share">Enviar por WhatsApp</button><div class="sub" style="font-size:12px;text-align:center;margin-top:-2px">Elige WhatsApp y luego el chat de ${esc(p.nombre.split(" ")[0])}.</div>`
        : `<a class="btn primary block" id="ep-wa" ${tel?`href="https://wa.me/${tel}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener"`:""}>Descargar PDF y abrir WhatsApp</a><div class="sub" style="font-size:12px;text-align:center;margin-top:-2px">Se descarga el PDF; adjúntalo en el chat que se abre.</div>`}
      <a class="btn block" id="ep-dl" href="${url}" download="${esc(nombreArch)}">Solo descargar PDF</a>
    </div>`, bd => {
      const sh = $("#ep-share", bd);
      if (sh) sh.onclick = async () => { try { await navigator.share({files:[file], title:nombreArch, text:msg}); closeSheet(); } catch(e){ if (e && e.name !== "AbortError") toast("No se pudo compartir. Usa “Solo descargar PDF”."); } };
      const wa = $("#ep-wa", bd);
      if (wa) wa.addEventListener("click", () => { $("#ep-dl", bd).click(); if (!tel) toast("El paciente no tiene teléfono registrado."); });
  });
}

/* ---------- copia de seguridad (modo local) ---------- */
function exportar(){
  const data = JSON.stringify({app:"OdontoVale", version:1, fecha:new Date().toISOString(), pacientes:S.pacientes, citas:S.citas}, null, 1);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data], {type:"application/json"}));
  a.download = `odontovale-copia-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  try { localStorage.setItem(LSKEY+"-copia", todayStr()); } catch(e){}
  S.ultimaCopia = fmtShort(todayStr()); render(); toast("Copia descargada");
}
document.addEventListener("change", async e => {
  if (e.target.id !== "importFile" || !e.target.files[0]) return;
  try {
    const d = JSON.parse(await e.target.files[0].text());
    if (!d || typeof d.pacientes !== "object" || typeof d.citas !== "object") throw 0;
    const np = Object.keys(d.pacientes).length, nc = Object.keys(d.citas).length;
    confirmSheet("Restaurar copia", `La copia tiene ${np} pacientes y ${nc} citas. Reemplazará los datos actuales de este equipo.`, "Restaurar", () => {
      S.pacientes = d.pacientes; S.citas = d.citas; localSave(); render(); toast("Copia restaurada");
    });
  } catch(err){ toast("Ese archivo no es una copia válida de OdontoVale."); }
  e.target.value = "";
});
